<button type="button" class="assistant-fab" (click)="toggleChat()" [attr.aria-expanded]="isOpen" aria-controls="assistantPanel" title="مساعد أُسطى" aria-label="مساعد أُسطى"><i class="bi" [ngClass]="isOpen ? 'bi-chevron-down' : 'bi-chat-dots'"></i></button>
<section *ngIf="isOpen" id="assistantPanel" class="assistant-panel" dir="rtl" role="dialog" aria-label="مساعد أُسطى" (keydown.escape)="toggleChat()">
<header><img src="/Logo.webp" alt="" width="40" height="40"><div><h2>مساعد أُسطى</h2><small>الخدمات والطلبات والتواصل</small></div><button type="button" title="محادثة جديدة" aria-label="محادثة جديدة" (click)="resetChat()" [disabled]="loading"><i class="bi bi-arrow-counterclockwise"></i></button><button type="button" title="إغلاق" aria-label="إغلاق" (click)="toggleChat()"><i class="bi bi-x-lg"></i></button></header>
<div #scrollContainer class="assistant-body" role="log" aria-live="polite">
<div class="assistant-welcome" *ngIf="messages.length === 1"><i class="bi bi-chat-heart"></i><h3>أهلًا، نساعدك بإيه؟</h3><p>اختار موضوع أو اكتب سؤالك.</p></div>
<article *ngFor="let msg of messages" [class.mine]="msg.sender === 'user'" [class.failed]="msg.isError"><small>{{ msg.sender === 'user' ? 'أنت' : 'أُسطى' }}</small><p>{{ msg.text }}</p><a *ngFor="let action of msg.actions" [routerLink]="action.path" (click)="toggleChat()">{{ action.label }} <i class="bi bi-arrow-left"></i></a><button *ngIf="msg.isError && !loading" class="retry" type="button" (click)="retryMessage()"><i class="bi bi-arrow-clockwise"></i> إعادة المحاولة</button></article>
<div *ngIf="loading" class="assistant-loading" role="status"><i class="bi bi-three-dots"></i> جاري تجهيز الرد...</div>
</div>
<div class="assistant-topics"><button *ngFor="let q of quickReplies" type="button" (click)="sendQuickReply(q)" [disabled]="loading">{{ q }}</button></div>
<footer><form (ngSubmit)="sendMessage()"><textarea [(ngModel)]="userInput" name="question" rows="2" maxlength="1000" placeholder="اكتب سؤالك هنا..." aria-label="سؤالك" (keydown.enter)="handleEnter($event)"></textarea><button type="submit" [disabled]="loading || !userInput.trim()" title="إرسال" aria-label="إرسال"><i class="bi bi-send"></i></button></form><small>مساعد تلقائي · <a routerLink="/contact-us" (click)="toggleChat()">تواصل مع الدعم</a></small></footer>
</section>
