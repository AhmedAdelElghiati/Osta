<div class="login-wrapper" dir="rtl">
  <div class="login-card">
    <h3 class="fw-bold text-center mb-2">نسيت كلمة المرور؟</h3>
    <p class="text-center text-muted mb-4">اكتب بريدك الإلكتروني وهنبعتلك رابط لإعادة تعيين كلمة المرور.</p>

    <ng-container *ngIf="!done; else sent">
      <label class="form-label-custom mb-2">البريد الإلكتروني</label>
      <input type="email" class="form-control mb-3" [(ngModel)]="email" name="email" dir="ltr"
        placeholder="name@example.com" (keyup.enter)="submit()" />
      <p class="text-danger" *ngIf="error">{{ error }}</p>
      <button type="button" class="btn bg-primary-custom text-white fw-bold w-100 py-2" [disabled]="loading" (click)="submit()">
        {{ loading ? 'جاري الإرسال...' : 'إرسال الرابط' }}
      </button>
    </ng-container>

    <ng-template #sent>
      <p class="text-center fw-bold">لو البريد ده مسجل عندنا، هيوصلك رابط إعادة التعيين خلال دقايق.</p>
    </ng-template>

    <p class="text-center mt-4 mb-0"><a routerLink="/login" class="text-secondary-custom fw-bold">الرجوع لتسجيل الدخول</a></p>
  </div>
</div>
