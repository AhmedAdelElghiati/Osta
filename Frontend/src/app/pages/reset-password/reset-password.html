<div class="login-wrapper" dir="rtl">
  <div class="login-card">
    <h3 class="fw-bold text-center mb-4">إعادة تعيين كلمة المرور</h3>

    <ng-container *ngIf="!done; else ok">
      <label class="form-label-custom mb-2">كلمة المرور الجديدة</label>
      <input type="password" class="form-control mb-3" [(ngModel)]="newPassword" name="np" (keyup.enter)="submit()" />
      <p class="text-danger" *ngIf="error">{{ error }}</p>
      <button type="button" class="btn bg-primary-custom text-white fw-bold w-100 py-2" [disabled]="loading" (click)="submit()">
        {{ loading ? 'جاري الحفظ...' : 'حفظ كلمة المرور' }}
      </button>
    </ng-container>

    <ng-template #ok>
      <p class="text-center fw-bold">تم تغيير كلمة المرور. هنحولك لتسجيل الدخول...</p>
    </ng-template>
  </div>
</div>
