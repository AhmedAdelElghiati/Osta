<aside class="dashboard-sidebar" [class.open]="open">

  
  <div class="sidebar-header">

    <a class="brand-wrapper text-decoration-none text-reset" routerLink="/" (click)="onClose()" aria-label="أُسطى - الصفحة الرئيسية" title="الصفحة الرئيسية">
      <span class="brand-name">أُسطى</span>
      <span class="craftsman-badge">الأسطى</span>
    </a>

    <button
      class="sidebar-close d-lg-none"
      type="button"
      (click)="onClose()"
      aria-label="إغلاق">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  </div>

  <nav class="sidebar-nav">

    <a
      routerLink="/dashboard/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="onClose()">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>الرئيسية</span>
    </a>

    <a
      routerLink="/dashboard/available-requests"
      routerLinkActive="active"
      (click)="onClose()">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>الطلبات المتاحة</span>
<span class="badge" *ngIf="requestsCount">{{ requestsCount }}</span>
    </a>

    <a
      routerLink="/dashboard/sent-offers"
      routerLinkActive="active"
      (click)="onClose()">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>عروضي المرسلة</span>
<span class="badge" *ngIf="offersCount">{{ offersCount }}</span>
    </a>

    <a
      routerLink="/dashboard/my-jobs"
      routerLinkActive="active"
      (click)="onClose()">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>شغلاناتي</span>
<span class="badge" *ngIf="jobsCount">{{ jobsCount }}</span>
    </a>

    <a
      routerLink="/dashboard/chat"
      routerLinkActive="active"
      (click)="onClose()">
      <i class="bi bi-chat-dots nav-icon" aria-hidden="true"></i>
      <span>محادثاتي</span>
    </a>

    <a
      routerLink="/dashboard/earnings"
      routerLinkActive="active"
      (click)="onClose()">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>الأرباح والمحفظة</span>
    </a>

    <a
      routerLink="/dashboard/profile"
      routerLinkActive="active"
      (click)="onClose()">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>بروفايلي</span>
    </a>

    <a
      routerLink="/dashboard/settings"
      routerLinkActive="active"
      (click)="onClose()">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>الإعدادات</span>
    </a>

  </nav>
<div class="sidebar-user">

  <div class="user-avatar">{{ initials }}</div>

  <div class="user-info">
    <strong>{{ account.name }}</strong>
    <small>{{ account.profession }} · {{ account.city }}</small>
  </div>

  <button class="user-settings-btn" routerLink="/dashboard/settings" title="الإعدادات">
    <!-- svg الإعدادات زي ما هو -->
  </button>

</div>

</aside>
