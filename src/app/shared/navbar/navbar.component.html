<!-- Top Announcement Banner -->
<div class="announcement-bar bg-primary-custom text-white">
  <div class="container announcement-container">

    <!-- Right Side -->
    <div class="announcement-text">

      <span class="badge bg-secondary-custom announcement-badge">
        جديد
      </span>

      <span>
        صنايعي شاطر وعايز تزود دخلك؟ انضم لأشطر أسطوات مصر الآن!
      </span>

    </div>

    <!-- Left Side -->
    <div class="announcement-action">

      <a
        routerLink="/craftsman-register"
        class="text-secondary-custom fw-bold"
      >
        سجل ورشتك / مهنتك كـ أسطى &larr;
      </a>

      <button
        type="button"
        class="btn-close btn-close-white"
        aria-label="Close"
      ></button>

    </div>

  </div>
</div>


<!-- Main Navbar -->
<nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
  <div class="container d-flex justify-content-between align-items-center">

    <!-- Logo + Brand -->
    <a class="navbar-brand m-0 d-flex align-items-center" routerLink="/">
      <img src="Logo.webp" alt="Osta" width="40" height="40" class="object-fit-contain" loading="lazy">

      <div class="brand-text me-2">
        <div class="brand-name">أسطي</div>
        <div class="brand-tagline">
          منصة الحرفيين المعتمدين
        </div>
      </div>
    </a>


    <!-- Mobile Toggler -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
      aria-controls="navContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>


    <!-- Center & Left sides -->
    <div class="collapse navbar-collapse justify-content-end" id="navContent">

      <!-- Center Links -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-semibold d-flex align-items-center">
        <li class="nav-item">
          <a class="nav-link active text-primary-custom fw-bold" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            الرئيسية
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/craftsmen-guide" routerLinkActive="active">
            دليل الأسطوات
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/how-it-works" routerLinkActive="active">
            شغالين ازاي؟
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/jobs-market" routerLinkActive="active">
            سوق الشغلانات والطلبات
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/contact-us" routerLinkActive="active">
            تواصل معانا
          </a>
        </li>
      </ul>


      <!-- Left Side: Auth -->
      <div class="auth-links d-flex align-items-center">

        <a routerLink="/login" class="fw-semibold login-link">
          تسجيل الدخول
        </a>

        <a routerLink="/client-register"
          class="btn btn-outline-secondary-custom fw-bold d-flex align-items-center px-4 py-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            class="mx-2">
            <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>

          حساب جديد
        </a>

      </div>

    </div>
  </div>
</nav>
